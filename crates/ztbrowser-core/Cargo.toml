[package]
name = "ztbrowser-core"
description = "Browser-independent domain logic of ZTBrowser: tracker blocking rules, privacy configuration, navigation, profiles and web apps."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "full-regex-handling"] }
form_urlencoded = "1.2.2"
idna = "1.1.0"
psl = "2"
regex = "1.13.1"
serde_json = "1.0.154"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

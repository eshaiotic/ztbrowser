[package]
name = "ztbrowser"
description = "ZTBrowser: a privacy-first WebKitGTK browser for Linux built on DuckDuckGo's open-source protections."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
futures-channel = "0.3.34"
gdk = { version = "0.11.5", package = "gdk4" }
gio = { version = "0.22.10", features = ["v2_80"] }
glib = "0.22.10"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
ztbrowser-core = { path = "../ztbrowser-core" }
javascriptcore = { version = "0.6.0", package = "javascriptcore6" }
serde_json = "1.0.154"
soup = { version = "0.9.0", package = "soup3", features = ["v3_6"] }
url = "2.5.8"
webkit6 = { version = "0.6.1", features = ["v2_52"] }

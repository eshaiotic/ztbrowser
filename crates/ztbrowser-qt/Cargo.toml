[package]
name = "ztbrowser-qt"
description = "ZTBrowser 1.2: the Qt/QML browser window on QtWebEngine (Chromium)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# `cxx-qt` generates `unsafe` code in the bridge modules, which the workspace-wide `forbid` rejects; the bridge
# modules are the only place that may contain it (see `main.rs`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dependencies]
base64 = "0.22.1"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
ztbrowser-core = { path = "../ztbrowser-core" }
ztbrowser-engine-qt = { path = "../ztbrowser-engine-qt" }
serde_json = "1.0.154"
url = "2.5.8"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[dev-dependencies]
tempfile = "3.27.0"

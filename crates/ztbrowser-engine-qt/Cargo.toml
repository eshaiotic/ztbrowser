[package]
name = "ztbrowser-engine-qt"
description = "QtWebEngine adapter: carries out the core's request, cookie and script decisions inside Chromium."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# `cxx` generates `unsafe` code inside the bridge module, which the workspace-wide `forbid` rejects. This crate
# therefore denies `unsafe_code` and allows it on the generated bridge module only; no hand-written unsafe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
ztbrowser-core = { path = "../ztbrowser-core" }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

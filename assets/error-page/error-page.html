<!doctype html>
<html lang="{{language}}" dir="{{direction}}" class="{{scheme}} tone-{{tone}} glyph-{{glyph}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="{{scheme}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{tab_title}}</title>
<style>
  :root {
    --accent: {{accent}};
    --on-accent: #ffffff;
    --bg: #fafafb;
    --fg: rgb(0 0 6 / 80%);
    --muted: rgb(0 0 6 / 60%);
    --ghost: rgb(0 0 6 / 7%);
    --ghost-strong: rgb(0 0 6 / 26%);
    --button: rgb(0 0 6 / 8%);
    --button-hover: rgb(0 0 6 / 12%);
    --button-active: rgb(0 0 6 / 22%);
    --danger: #e01b24;
    --danger-text: #c01c28;
    --warning: #e5a50a;
  }

  html.dark {
    --bg: #222226;
    --fg: #ffffff;
    --muted: rgb(255 255 255 / 62%);
    --ghost: rgb(255 255 255 / 7%);
    --ghost-strong: rgb(255 255 255 / 28%);
    --button: rgb(255 255 255 / 10%);
    --button-hover: rgb(255 255 255 / 15%);
    --button-active: rgb(255 255 255 / 26%);
    --danger: #c01c28;
    --danger-text: #ff7b63;
    --warning: #cd9309;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 system-ui, "Cantarell", "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body { margin: 0; }

  ::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: max(12vh, 48px) 40px 64px;
  }

  .illustration {
    display: block;
    width: 104px;
    height: 104px;
    margin-block: 0 28px;
    margin-inline: -6px 0;
  }

  .shield { fill: var(--ghost); }

  .badge-ring { fill: var(--bg); }
  .badge { fill: var(--accent); }
  .tone-danger .badge { fill: var(--danger); }
  .tone-warning .badge { fill: var(--warning); }

  .glyph { display: none; fill: none; stroke: var(--on-accent); stroke-width: 3.25; stroke-linecap: round; stroke-linejoin: round; }
  .glyph .solid { fill: var(--on-accent); stroke: none; }
  .tone-warning .glyph { stroke: rgb(0 0 0 / 80%); }
  .tone-warning .glyph .solid { fill: rgb(0 0 0 / 80%); }
  .glyph-search .g-search,
  .glyph-offline .g-offline,
  .glyph-alert .g-alert,
  .glyph-clock .g-clock,
  .glyph-lock .g-lock,
  .glyph-file .g-file,
  .glyph-blocked .g-blocked,
  .glyph-crash .g-crash { display: inline; }

  h1 {
    margin: 0 0 12px;
    font-size: 1.875rem;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }

  .lead {
    margin: 0;
    max-width: 62ch;
    text-wrap: pretty;
  }

  .lead strong { font-weight: 700; overflow-wrap: anywhere; unicode-bidi: isolate; }

  .points {
    margin: 22px 0 0;
    padding: 0;
    list-style: none;
    max-width: 62ch;
  }

  .points li {
    position: relative;
    margin: 0 0 8px;
    padding-inline-start: 22px;
    color: var(--muted);
    text-wrap: pretty;
  }

  .points li::before {
    content: "";
    position: absolute;
    inset-inline-start: 4px;
    top: 0.62em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ghost-strong);
  }

  .tone-danger .points li { color: var(--fg); }
  .tone-danger .points li::before { background: var(--danger-text); }

  .note {
    margin: 18px 0 0;
    max-width: 62ch;
    color: var(--muted);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 36px;
  }

  .button {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    padding: 9px 26px;
    border-radius: 9999px;
    background: var(--button);
    color: var(--fg);
    font-weight: 700;
    text-decoration: none;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }

  .button:hover { background: var(--button-hover); }
  .button:active { background: var(--button-active); }

  .button.primary {
    background: var(--accent);
    color: var(--on-accent);
  }

  .button.primary:hover { background: linear-gradient(rgb(255 255 255 / 10%), rgb(255 255 255 / 10%)) var(--accent); }
  .button.primary:active { background: linear-gradient(rgb(0 0 0 / 20%), rgb(0 0 0 / 20%)) var(--accent); }

  .button:focus-visible { outline-color: color-mix(in srgb, var(--accent) 55%, transparent); }

  .detail {
    margin: 44px 0 0;
    max-width: 62ch;
    color: var(--muted);
    font: 12.5px/1.5 ui-monospace, "Source Code Pro", "Noto Sans Mono", monospace;
    overflow-wrap: anywhere;
    unicode-bidi: plaintext;
  }

  @media (max-width: 520px) {
    main { padding: 40px 24px 48px; }
    .illustration { width: 88px; height: 88px; margin-block-end: 22px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<main>
  <svg class="illustration" viewBox="0 0 128 128" aria-hidden="true">
    <g transform="scale(0.10207)">
      <mask id="chain-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254"><path fill="#fff" d="M626 97L148.3 290.8Q139 294.6 139 304.6V495.8C139 787.3 335.9 1054.4 626 1171C916.1 1054.4 1113 787.3 1113 495.8V304.6Q1113 294.6 1103.7 290.8Z"/><g transform="rotate(-45 643 622.5)" fill="none"><path transform="rotate(2.1 792.7 635.1)" stroke="#000" stroke-width="85.6" d="M704.9 487.8H880.5C961.9 487.8 1027.8 553.7 1027.8 635.1C1027.8 716.5 961.9 782.4 880.5 782.4H704.9C623.5 782.4 557.6 716.5 557.6 635.1C557.6 553.7 623.5 487.8 704.9 487.8Z"/><path transform="rotate(3.3 478.9 611.4)" stroke="#fff" stroke-width="123.4" d="M399.6 469H558.3C636.9 469 700.7 532.8 700.7 611.4C700.7 690 636.9 753.8 558.3 753.8H399.6C321 753.8 257.2 690 257.2 611.4C257.2 532.8 321 469 399.6 469Z"/><path transform="rotate(3.3 478.9 611.4)" stroke="#000" stroke-width="83.4" d="M399.6 469H558.3C636.9 469 700.7 532.8 700.7 611.4C700.7 690 636.9 753.8 558.3 753.8H399.6C321 753.8 257.2 690 257.2 611.4C257.2 532.8 321 469 399.6 469Z"/><path transform="rotate(2.1 792.7 635.1)" stroke="#fff" stroke-width="125.6" d="M759.9 782.4H704.9C628.5 782.4 564.8 724 558.2 647.9"/><path transform="rotate(2.1 792.7 635.1)" stroke="#000" stroke-width="85.6" d="M769.9 782.4H704.9C623.5 782.4 557.6 716.5 557.6 635.1"/></g></mask>
      <path class="shield" mask="url(#chain-cutout)" d="M626 97L148.3 290.8Q139 294.6 139 304.6V495.8C139 787.3 335.9 1054.4 626 1171C916.1 1054.4 1113 787.3 1113 495.8V304.6Q1113 294.6 1103.7 290.8Z"/>
    </g>
    <circle class="badge-ring" cx="100" cy="98" r="26"/>
    <circle class="badge" cx="100" cy="98" r="21"/>
    <g class="glyph g-search"><circle cx="97" cy="95" r="7.5"/><path d="M102.5 100.5 L108.5 106.5"/></g>
    <g class="glyph g-offline"><path d="M88 93.5 C95 87.5 105 87.5 112 93.5 M92.5 99 C97 95.5 103 95.5 107.5 99 M89.5 86.5 L110.5 109.5"/><circle class="solid" cx="100" cy="105" r="2.3"/></g>
    <g class="glyph g-alert"><path d="M100 87.5 V100"/><circle class="solid" cx="100" cy="107.5" r="2.4"/></g>
    <g class="glyph g-clock"><circle cx="100" cy="98" r="10"/><path d="M100 92 V98 L104.5 101"/></g>
    <g class="glyph g-lock"><path d="M94.5 96 V92.5 A5.5 5.5 0 0 1 105.5 92.5 V96"/><rect class="solid" x="90.5" y="95.5" width="19" height="14" rx="3"/></g>
    <g class="glyph g-file"><path d="M94 86.5 H102 L107 91.5 V109.5 H94 Z M102 86.5 V91.5 H107"/></g>
    <g class="glyph g-blocked"><circle cx="100" cy="98" r="10"/><path d="M93 91 L107 105"/></g>
    <g class="glyph g-crash"><path class="solid" d="M102.5 86 L91.5 100.5 H99.5 L97.5 110 L108.5 95.5 H100.5 Z"/></g>
  </svg>
  <h1>{{title}}</h1>
  <p class="lead">{{lead}}</p>
  {{points}}
  {{actions}}
  {{detail}}
</main>
</body>
</html>

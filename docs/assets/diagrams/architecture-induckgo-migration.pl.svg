<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Inter, DejaVu Sans, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1000" height="700" fill="#ffffff"/>
<text x="30" y="48" font-size="22" font-weight="700" fill="#111827">Pierwszy start po zmianie nazwy: InDuckGo → ZTBrowser</text>
<rect x="30" y="90" width="280" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="46" y="124" font-size="17" font-weight="700" fill="#111827">1. Start ZTBrowsera</text>
<text x="46" y="150" font-size="14" fill="#374151">czyta katalogi XDG: dane,</text>
<text x="46" y="170" font-size="14" fill="#374151">cache i runtime</text>
<rect x="360" y="90" width="300" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="376" y="124" font-size="17" font-weight="700" fill="#111827">2. Czekają dane InDuckGo?</text>
<text x="376" y="150" font-size="14" fill="#374151">jest induckgo/,</text>
<text x="376" y="170" font-size="14" fill="#374151">nie ma ztbrowser/</text>
<rect x="710" y="90" width="275" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="726" y="124" font-size="17" font-weight="700" fill="#111827">Używa ztbrowser/</text>
<text x="726" y="150" font-size="14" fill="#374151">nie ma czego przenosić</text>
<rect x="360" y="250" width="300" height="100" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="376" y="284" font-size="17" font-weight="700" fill="#111827">3. InDuckGo wciąż działa?</text>
<text x="376" y="310" font-size="14" fill="#374151">gniazdo w run/induckgo/</text>
<text x="376" y="330" font-size="14" fill="#374151">odpowiada na próbę</text>
<rect x="710" y="240" width="275" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="726" y="274" font-size="17" font-weight="700" fill="#111827">Czeka: używa induckgo/</text>
<text x="726" y="300" font-size="14" fill="#374151">to samo okno w InDuckGo:</text>
<text x="726" y="320" font-size="14" fill="#374151">przekazuje mu uruchomienie;</text>
<text x="726" y="340" font-size="14" fill="#374151">następny start próbuje znowu</text>
<rect x="360" y="410" width="300" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="376" y="444" font-size="17" font-weight="700" fill="#111827">4. Przenosi katalogi</text>
<text x="376" y="470" font-size="14" fill="#374151">najpierw cache, potem dane;</text>
<text x="376" y="490" font-size="14" fill="#374151">usuwa cache Qt „InDuckGo”</text>
<rect x="360" y="570" width="300" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="376" y="604" font-size="17" font-weight="700" fill="#111827">5. Przepina wpisy menu</text>
<text x="376" y="630" font-size="14" fill="#374151">web appy uruchamiają ZTBrowser;</text>
<text x="376" y="650" font-size="14" fill="#374151">wpis AppImage InDuckGo znika</text>
<path d="M310,140 L358,140" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,140 L708,140" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="672" y="130" font-size="14" font-weight="700" fill="#111827">nie</text>
<path d="M510,190 L510,248" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="225" font-size="14" font-weight="700" fill="#111827">tak</text>
<path d="M660,300 L708,300" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="670" y="290" font-size="14" font-weight="700" fill="#111827">tak</text>
<path d="M510,350 L510,408" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="385" font-size="14" font-weight="700" fill="#111827">nie</text>
<path d="M510,510 L510,568" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="430" font-size="15" font-weight="700" fill="#111827">Legenda</text>
<rect x="30" y="450" width="28" height="20" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="70" y="465" font-size="14" fill="#374151">krok</text>
<rect x="30" y="482" width="28" height="20" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="70" y="497" font-size="14" fill="#374151">sprawdzenie (największe ryzyko)</text>
<rect x="30" y="514" width="28" height="20" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="70" y="529" font-size="14" fill="#374151">stan oczekiwania</text>
<rect x="30" y="546" width="28" height="20" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="70" y="561" font-size="14" fill="#374151">wynik</text>
</svg>

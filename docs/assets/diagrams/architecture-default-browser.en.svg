<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="Inter, DejaVu Sans, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1000" height="860" fill="#ffffff"/>
<text x="30" y="48" font-size="22" font-weight="700" fill="#111827">Default browser: offered, never imposed</text>
<rect x="30" y="90" width="280" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="46" y="124" font-size="17" font-weight="700" fill="#111827">1. A window opens</text>
<text x="46" y="150" font-size="14" fill="#374151">web-app windows never ask;</text>
<text x="46" y="170" font-size="14" fill="#374151">the first frame is not delayed</text>
<rect x="360" y="90" width="300" height="100" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="376" y="124" font-size="17" font-weight="700" fill="#111827">2. Asks at start?</text>
<text x="376" y="150" font-size="14" fill="#374151">a second later, from</text>
<text x="376" y="170" font-size="14" fill="#374151">default-browser.json (no file: yes)</text>
<rect x="710" y="90" width="275" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="726" y="124" font-size="17" font-weight="700" fill="#111827">Nothing is asked</text>
<text x="726" y="150" font-size="14" fill="#374151">the person said</text>
<text x="726" y="170" font-size="14" fill="#374151">“Don't Ask Again”</text>
<rect x="360" y="250" width="300" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="376" y="284" font-size="17" font-weight="700" fill="#111827">3. Ask the desktop</text>
<text x="376" y="310" font-size="14" fill="#374151">on a thread of its own:</text>
<text x="376" y="330" font-size="14" fill="#374151">xdg-settings get default-web-browser</text>
<rect x="710" y="250" width="275" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="726" y="284" font-size="17" font-weight="700" fill="#111827">No bar</text>
<text x="726" y="310" font-size="14" fill="#374151">ZTBrowser opens links already,</text>
<text x="726" y="330" font-size="14" fill="#374151">or no menu entry / no xdg-settings</text>
<rect x="360" y="410" width="300" height="100" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="376" y="444" font-size="17" font-weight="700" fill="#111827">4. First window to ask?</text>
<text x="376" y="470" font-size="14" fill="#374151">one offer per process;</text>
<text x="376" y="490" font-size="14" fill="#374151">later windows stay quiet</text>
<rect x="710" y="410" width="275" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="726" y="444" font-size="17" font-weight="700" fill="#111827">No bar</text>
<text x="726" y="470" font-size="14" fill="#374151">another window of this</text>
<text x="726" y="490" font-size="14" fill="#374151">process showed it</text>
<rect x="360" y="570" width="300" height="110" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="376" y="604" font-size="17" font-weight="700" fill="#111827">5. The bar under the toolbar</text>
<text x="376" y="630" font-size="14" fill="#374151">“ZTBrowser is not your default</text>
<text x="376" y="650" font-size="14" fill="#374151">browser”: three answers →</text>
<rect x="710" y="548" width="275" height="62" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="726" y="574" font-size="16" font-weight="700" fill="#111827">Make Default</text>
<text x="726" y="596" font-size="14" fill="#374151">xdg-settings set … ZTBrowser</text>
<rect x="710" y="624" width="275" height="62" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="726" y="650" font-size="16" font-weight="700" fill="#111827">Don't Ask Again</text>
<text x="726" y="672" font-size="14" fill="#374151">asksAtStart: false, for good</text>
<rect x="710" y="700" width="275" height="62" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="726" y="726" font-size="16" font-weight="700" fill="#111827">✕ Close</text>
<text x="726" y="748" font-size="14" fill="#374151">asked again at the next start</text>
<rect x="30" y="570" width="280" height="110" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="46" y="604" font-size="17" font-weight="700" fill="#111827">Preferences → Interface</text>
<text x="46" y="630" font-size="14" fill="#374151">same check and change, and the</text>
<text x="46" y="650" font-size="14" fill="#374151">switch that brings the question back</text>
<path d="M310,140 L358,140" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,140 L708,140" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="670" y="130" font-size="14" font-weight="600" fill="#374151">no</text>
<path d="M510,190 L510,248" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="225" font-size="14" font-weight="600" fill="#374151">yes</text>
<path d="M660,300 L708,300" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M510,350 L510,408" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="385" font-size="14" font-weight="600" fill="#374151">another browser</text>
<path d="M660,460 L708,460" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="670" y="450" font-size="14" font-weight="600" fill="#374151">no</text>
<path d="M510,510 L510,568" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="545" font-size="14" font-weight="600" fill="#374151">yes</text>
<path d="M660,600 L684,600 L684,579 L708,579" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,625 L684,625 L684,655 L708,655" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,650 L674,650 L674,731 L708,731" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M170,570 L170,320 L358,320" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="180" y="440" font-size="14" font-weight="600" fill="#374151">on opening</text>
<rect x="30" y="800" width="22" height="16" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="60" y="813" font-size="13" fill="#374151">ZTBrowser's own step</text>
<rect x="230.0" y="800" width="22" height="16" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="260.0" y="813" font-size="13" fill="#374151">decision</text>
<rect x="343.6" y="800" width="22" height="16" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="373.6" y="813" font-size="13" fill="#374151">nothing changes</text>
<rect x="507.6" y="800" width="22" height="16" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="537.6" y="813" font-size="13" fill="#374151">the person's lasting choice</text>
<rect x="30" y="828" width="22" height="16" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="60" y="841" font-size="13" fill="#374151">the only step that changes the desktop</text>
</svg>

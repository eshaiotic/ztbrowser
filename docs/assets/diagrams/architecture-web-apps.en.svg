<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Inter, DejaVu Sans, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<text x="30" y="44" font-size="22" font-weight="700" fill="#111827">Install Site as App (Qt edition)</text>
<rect x="30" y="90" width="300" height="110" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="46" y="128" font-size="17" font-weight="700" fill="#111827">1. Page on screen</text>
<text x="46" y="154" font-size="14" fill="#374151">collector script reads title,</text>
<text x="46" y="174" font-size="14" fill="#374151">manifest, icon links</text>
<rect x="350" y="90" width="300" height="110" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="366" y="128" font-size="17" font-weight="700" fill="#111827">2. Fetch without cookies</text>
<text x="366" y="154" font-size="14" fill="#374151">manifest + icons, size-limited,</text>
<text x="366" y="174" font-size="14" fill="#374151">best icon first</text>
<rect x="670" y="90" width="300" height="110" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="686" y="128" font-size="17" font-weight="700" fill="#111827">3. Validate and decide</text>
<text x="686" y="154" font-size="14" fill="#374151">draft name, PNG header, Qt</text>
<text x="686" y="174" font-size="14" fill="#374151">re-encodes the PNG</text>
<rect x="30" y="260" width="300" height="110" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="46" y="298" font-size="17" font-weight="700" fill="#111827">4. Write the app</text>
<text x="46" y="324" font-size="14" fill="#374151">web-apps.json, icon.png,</text>
<text x="46" y="344" font-size="14" fill="#374151">&lt;app-id&gt;.desktop</text>
<rect x="350" y="260" width="300" height="110" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="366" y="298" font-size="17" font-weight="700" fill="#111827">5. Start the app</text>
<text x="366" y="324" font-size="14" fill="#374151">ztbrowser-qt --web-app ID, own</text>
<text x="366" y="344" font-size="14" fill="#374151">profile</text>
<rect x="670" y="260" width="300" height="110" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="686" y="298" font-size="17" font-weight="700" fill="#111827">6. Desktop matches window</text>
<text x="686" y="324" font-size="14" fill="#374151">app_id = file name,</text>
<text x="686" y="344" font-size="14" fill="#374151">StartupWMClass, Icon=</text>
<path d="M330,145 L350,145" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M650,145 L670,145" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M820,200 L820,230 L180,230 L180,260" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M330,315 L350,315" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M650,315 L670,315" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="430" width="22" height="22" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="62" y="447" font-size="13" fill="#374151">Interface (QML)</text>
<rect x="500" y="430" width="22" height="22" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="532" y="447" font-size="13" fill="#374151">Rust (ztbrowser-qt)</text>
<rect x="30" y="470" width="22" height="22" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="62" y="487" font-size="13" fill="#374151">Files the desktop reads</text>
<rect x="500" y="470" width="22" height="22" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="532" y="487" font-size="13" fill="#374151">Highest risk: bytes from a site</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" font-family="DejaVu Sans, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111827">How ZTBrowser picks and applies its interface language</text>
<rect x="40" y="110" width="224" height="190" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="152.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">interface.json</text>
<text x="152.0" y="168" font-size="11.5" text-anchor="middle" fill="#374151">The person's choice:</text>
<text x="152.0" y="185" font-size="11.5" text-anchor="middle" fill="#374151">"system" or one language</text>
<line x1="264" y1="205.0" x2="277" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="280" y="110" width="224" height="190" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="392.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">System locales</text>
<text x="392.0" y="168" font-size="11.5" text-anchor="middle" fill="#374151">glib::language_names()</text>
<text x="392.0" y="185" font-size="11.5" text-anchor="middle" fill="#374151">pl_PL.UTF-8, pl, C</text>
<line x1="504" y1="205.0" x2="517" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="520" y="110" width="224" height="190" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="632.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">LanguageChoice::</text>
<text x="632.0" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">resolve</text>
<text x="632.0" y="186" font-size="11.5" text-anchor="middle" fill="#374151">one of 68 languages,</text>
<text x="632.0" y="203" font-size="11.5" text-anchor="middle" fill="#374151">American English</text>
<text x="632.0" y="220" font-size="11.5" text-anchor="middle" fill="#374151">if none fits</text>
<line x1="744" y1="205.0" x2="757" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="760" y="110" width="224" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="872.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Restart once</text>
<text x="872.0" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">with LANGUAGE</text>
<text x="872.0" y="186" font-size="11.5" text-anchor="middle" fill="#374151">only for a fixed language:</text>
<text x="872.0" y="203" font-size="11.5" text-anchor="middle" fill="#374151">GTK, libadwaita, WebKit</text>
<text x="872.0" y="220" font-size="11.5" text-anchor="middle" fill="#374151">read LANGUAGE at first use</text>
<line x1="984" y1="205.0" x2="997" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1000" y="110" width="224" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1112.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">InterfaceMessages::</text>
<text x="1112.0" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">install</text>
<text x="1112.0" y="186" font-size="11.5" text-anchor="middle" fill="#374151">loads locales/&lt;tag&gt;.po</text>
<text x="1112.0" y="203" font-size="11.5" text-anchor="middle" fill="#374151">(compiled into the program)</text>
<line x1="1224" y1="205.0" x2="1237" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1240" y="110" width="224" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1352.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Windows, menus, dialogs,</text>
<text x="1352.0" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">error page</text>
<text x="1352.0" y="186" font-size="11.5" text-anchor="middle" fill="#374151">every text from tr!(...)</text>
<text x="1352.0" y="203" font-size="11.5" text-anchor="middle" fill="#374151">or catalogue.text(...)</text>
<rect x="40" y="340" width="20" height="20" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="68" y="355" font-size="14" fill="#111827">Stored</text>
<rect x="154" y="340" width="20" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="182" y="355" font-size="14" fill="#111827">Decision</text>
<rect x="286" y="340" width="20" height="20" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="314" y="355" font-size="14" fill="#111827">Applies the language</text>
<text x="40" y="420" font-size="14" fill="#4b5563">A change in Preferences > Interface is saved at once and applies at the next start.</text></svg>
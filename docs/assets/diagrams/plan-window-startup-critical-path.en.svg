<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<title>Window start-up of ZTBrowser: the critical path and where the planned work acts</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker></defs>
<rect width="1120" height="600" fill="#fbfbfd"/>
<text x="24" y="34" font-size="17" font-weight="700" fill="#1f2430">Window start-up of ZTBrowser: the critical path and where the planned work acts</text>
<text x="24" y="58" font-size="12.5" fill="#5b6270">Measured to the first Wayland frame: package 0.72 s (median of 4), AppImage 1.73 s. Box widths are illustrative, not to scale.</text>
<rect x="16" y="80" width="1088" height="144" rx="10" fill="#f2f3f8" stroke="#e1e3ec"/>
<text x="28" y="100" font-size="12" font-weight="700" fill="#5b6270">Main thread</text>
<rect x="16" y="240" width="1088" height="124" rx="10" fill="#f2f3f8" stroke="#e1e3ec"/>
<text x="28" y="260" font-size="12" font-weight="700" fill="#5b6270">Worker thread (protection rules)</text>
<rect x="16" y="380" width="1088" height="104" rx="10" fill="#f2f3f8" stroke="#e1e3ec"/>
<text x="28" y="400" font-size="12" font-weight="700" fill="#5b6270">Chromium processes</text>
<rect x="30" y="118" width="125" height="76" rx="8" fill="#dbe7fb" stroke="#8b93a5" stroke-width="1.4"/>
<text x="92.5" y="151.0" text-anchor="middle" font-size="13" fill="#1f2430">exec +</text>
<text x="92.5" y="169.0" text-anchor="middle" font-size="13" fill="#1f2430">shared libraries</text>
<rect x="170" y="118" width="150" height="76" rx="8" fill="#dbe7fb" stroke="#8b93a5" stroke-width="1.4"/>
<text x="245.0" y="142.0" text-anchor="middle" font-size="13" fill="#1f2430">Qt application,</text>
<text x="245.0" y="160.0" text-anchor="middle" font-size="13" fill="#1f2430">single instance,</text>
<text x="245.0" y="178.0" text-anchor="middle" font-size="13" fill="#1f2430">profile paths</text>
<rect x="335" y="118" width="125" height="76" rx="8" fill="#dbe7fb" stroke="#8b93a5" stroke-width="1.4"/>
<text x="397.5" y="151.0" text-anchor="middle" font-size="13" fill="#1f2430">open</text>
<text x="397.5" y="169.0" text-anchor="middle" font-size="13" fill="#1f2430">session</text>
<rect x="480" y="118" width="250" height="76" rx="8" fill="#dbe7fb" stroke="#2e9e5b" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="605.0" y="151.0" text-anchor="middle" font-size="13" fill="#1f2430">open Chromium profile</text>
<text x="605.0" y="169.0" text-anchor="middle" font-size="13" fill="#1f2430">(QtWebEngine::open_profile)</text>
<rect x="750" y="118" width="150" height="76" rx="8" fill="#dbe7fb" stroke="#8b93a5" stroke-width="1.4"/>
<text x="825.0" y="151.0" text-anchor="middle" font-size="13" fill="#1f2430">join, then</text>
<text x="825.0" y="169.0" text-anchor="middle" font-size="13" fill="#1f2430">install policies</text>
<rect x="920" y="118" width="170" height="76" rx="8" fill="#dbe7fb" stroke="#8b93a5" stroke-width="1.4"/>
<text x="1005.0" y="151.0" text-anchor="middle" font-size="13" fill="#1f2430">window + QML +</text>
<text x="1005.0" y="169.0" text-anchor="middle" font-size="13" fill="#1f2430">first page</text>
<rect x="415" y="268" width="145" height="76" rx="8" fill="#d3efe9" stroke="#2e9e5b" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="487.5" y="301.0" text-anchor="middle" font-size="13" fill="#1f2430">read or download</text>
<text x="487.5" y="319.0" text-anchor="middle" font-size="13" fill="#1f2430">documents</text>
<rect x="574" y="268" width="165" height="76" rx="8" fill="#d3efe9" stroke="#2e9e5b" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="656.5" y="301.0" text-anchor="middle" font-size="13" fill="#1f2430">start Guard engine</text>
<text x="656.5" y="319.0" text-anchor="middle" font-size="13" fill="#1f2430">build (own thread)</text>
<rect x="753" y="268" width="80" height="76" rx="8" fill="#d3efe9" stroke="#2e9e5b" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="793.0" y="301.0" text-anchor="middle" font-size="13" fill="#1f2430">assemble</text>
<text x="793.0" y="319.0" text-anchor="middle" font-size="13" fill="#1f2430">rules</text>
<rect x="920" y="410" width="170" height="66" rx="8" fill="#e6e6ea" stroke="#8b93a5" stroke-width="1.4"/>
<text x="1005.0" y="438.0" text-anchor="middle" font-size="13" fill="#1f2430">renderer + GPU</text>
<text x="1005.0" y="456.0" text-anchor="middle" font-size="13" fill="#1f2430">processes start</text>

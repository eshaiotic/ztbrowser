<line x1="320" y1="156" x2="333" y2="156" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="460" y1="156" x2="478" y2="156" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="730" y1="156" x2="748" y2="156" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="900" y1="156" x2="918" y2="156" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="1005" y1="194" x2="1005" y2="408" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="560" y1="306" x2="572" y2="306" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="739" y1="306" x2="751" y2="306" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<line x1="793" y1="268" x2="793" y2="196" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<path d="M 397 194 L 397 306 L 413 306" fill="none" stroke="#5b6270" stroke-width="1.8" marker-end="url(#head)"/>
<text x="405" y="258" font-size="12" fill="#5b6270">spawn</text>
<text x="803" y="240" font-size="12" fill="#5b6270">join</text>
<circle cx="162" cy="96" r="12" fill="#f08c2e" stroke="white" stroke-width="2"/><text x="162" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>
<circle cx="318" cy="120" r="12" fill="#f08c2e" stroke="white" stroke-width="2"/><text x="318" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="white">6</text>
<circle cx="458" cy="120" r="12" fill="#f08c2e" stroke="white" stroke-width="2"/><text x="458" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>
<circle cx="1088" cy="120" r="12" fill="#f08c2e" stroke="white" stroke-width="2"/><text x="1088" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>
<circle cx="1088" cy="196" r="12" fill="#f08c2e" stroke="white" stroke-width="2"/><text x="1088" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="white">4</text>
<circle cx="153" cy="196" r="12" fill="#f08c2e" stroke="white" stroke-width="2"/><text x="153" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="white">5</text>
<rect x="24" y="514" width="22" height="16" rx="3" fill="#dbe7fb" stroke="#8b93a5"/>
<text x="54" y="527" font-size="12.5" fill="#1f2430">Main-thread step</text>
<rect x="222" y="514" width="22" height="16" rx="3" fill="#d3efe9" stroke="#8b93a5"/>
<text x="252" y="527" font-size="12.5" fill="#1f2430">Worker step</text>
<rect x="380" y="514" width="22" height="16" rx="3" fill="#e6e6ea" stroke="#8b93a5"/>
<text x="410" y="527" font-size="12.5" fill="#1f2430">Chromium process</text>
<rect x="578" y="514" width="22" height="16" rx="3" fill="#ffffff" stroke="#2e9e5b" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="608" y="527" font-size="12.5" fill="#1f2430">Overlap already implemented</text>
<circle cx="36" cy="560" r="12" fill="#f08c2e" stroke="white" stroke-width="2"/><text x="36" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="white">n</text>
<text x="58" y="565" font-size="12.5" fill="#1f2430">Planned candidate; the number is the section of the plan that describes it</text>
</svg>
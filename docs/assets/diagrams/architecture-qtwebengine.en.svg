<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs><rect width="1200" height="760" fill="#fff"/><text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f24">Target architecture of ZTBrowser 1.2.0</text><rect x="200" y="60" width="800" height="100" rx="10" fill="#e3f4e1" stroke="#2e7d32" stroke-width="2"/><text x="600.0" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">ztbrowser-core</text><text x="600.0" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">domain rules + ports (RequestPolicy, CookiePolicy, PageScripts, ProfileStorage, DataBurner)</text><text x="600.0" y="130" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">no Qt, no GTK, no engine types</text><rect x="60" y="230" width="500" height="110" rx="10" fill="#e1ecfa" stroke="#1565c0" stroke-width="2"/><text x="310.0" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">ztbrowser-engine-qt</text><text x="310.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">adapter implementing the ports</text><text x="310.0" y="300" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">C++ shim (~300-500 lines): interceptor, cookie filter, schemes</text><rect x="640" y="230" width="420" height="110" rx="10" fill="#e1ecfa" stroke="#1565c0" stroke-width="2"/><text x="850.0" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">ztbrowser-qt</text><text x="850.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">windows, tabs, menus, dialogs (QML)</text><text x="850.0" y="300" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">bound to Rust with cxx-qt</text><rect x="40" y="420" width="540" height="110" rx="10" fill="#eceff1" stroke="#c62828" stroke-width="4"/><text x="310.0" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">QtWebEngine = Chromium 140</text><text x="310.0" y="468" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">sandbox, site isolation, GPU process stay ON</text><text x="310.0" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#1b1f24">RISK: no response-header hook, no farbling, base older than 156</text><rect x="690" y="420" width="370" height="110" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/><text x="875.0" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Page scripts (JS, own world)</text><text x="875.0" y="468" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">Content Scope Scripts, Guard, smooth wheel,</text><text x="875.0" y="490" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">DDG overlays: Duck Player, Click to Load, autoconsent</text><rect x="40" y="590" width="420" height="80" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/><text x="250.0" y="616" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Tor window = separate process</text><text x="250.0" y="638" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">--proxy-server=socks5://... (proxy is process-wide)</text><rect x="480" y="590" width="340" height="80" rx="10" fill="#f5f5f5" stroke="#757575" stroke-width="2" stroke-dasharray="8 5"/><text x="650.0" y="616" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">ztbrowser (GTK + WebKitGTK)</text><text x="650.0" y="638" text-anchor="middle" font-size="11" font-weight="400" fill="#1b1f24">kept building until parity, then removed</text><rect x="840" y="590" width="320" height="80" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="1000.0" y="616" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24">Runtime data (CC BY-NC-SA)</text><text x="1000.0" y="638" text-anchor="middle" font-size="11" font-weight="400" fill="#1b1f24">Tracker Radar, lists: downloaded, never shipped</text><line x1="310" y1="230" x2="310" y2="160" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="320" y="200" font-size="12" fill="#444">implements ports</text><line x1="850" y1="230" x2="850" y2="160" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="860" y="200" font-size="12" fill="#444">uses</text><line x1="560" y1="285" x2="640" y2="285" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="566" y="278" font-size="12" fill="#444">drives</text><line x1="310" y1="420" x2="310" y2="340" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="320" y="385" font-size="12" fill="#444">drives</text><line x1="690" y1="475" x2="580" y2="475" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="596" y="466" font-size="12" fill="#444">injects</text><path d="M1000,590 L1000,560 L1130,560 L1130,110 L1000,110" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/> <text x="1012" y="552" font-size="12" fill="#444">fetched at run time</text><line x1="260" y1="590" x2="260" y2="530" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="700" width="22" height="16" fill="#e3f4e1" stroke="#2e7d32" stroke-width="2"/><text x="90" y="713" font-size="12" fill="#1b1f24">domain (kept, extended)</text><rect x="340" y="700" width="22" height="16" fill="#e1ecfa" stroke="#1565c0" stroke-width="2"/><text x="370" y="713" font-size="12" fill="#1b1f24">new adapter / UI</text><rect x="620" y="700" width="22" height="16" fill="#eceff1" stroke="#c62828" stroke-width="2"/><text x="650" y="713" font-size="12" fill="#1b1f24">highest risk</text><rect x="900" y="700" width="22" height="16" fill="#f5f5f5" stroke="#757575" stroke-width="2"/><text x="930" y="713" font-size="12" fill="#1b1f24">temporary</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs><rect width="1200" height="760" fill="#fff"/><text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1f24">Docelowa architektura ZTBrowser 1.2.0</text><rect x="200" y="60" width="800" height="100" rx="10" fill="#e3f4e1" stroke="#2e7d32" stroke-width="2"/><text x="600.0" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">ztbrowser-core</text><text x="600.0" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">reguły domenowe + porty (RequestPolicy, CookiePolicy, PageScripts, ProfileStorage, DataBurner)</text><text x="600.0" y="130" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">bez Qt, bez GTK, bez typów silnika</text><rect x="60" y="230" width="500" height="110" rx="10" fill="#e1ecfa" stroke="#1565c0" stroke-width="2"/><text x="310.0" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">ztbrowser-engine-qt</text><text x="310.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">adapter implementujący porty</text><text x="310.0" y="300" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">shim C++ (~300-500 linii): interceptor, filtr ciasteczek, schematy</text><rect x="640" y="230" width="420" height="110" rx="10" fill="#e1ecfa" stroke="#1565c0" stroke-width="2"/><text x="850.0" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">ztbrowser-qt</text><text x="850.0" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#1b1f24">okna, karty, menu, dialogi (QML)</text><text x="850.0" y="300" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">powiązane z Rustem przez cxx-qt</text><rect x="40" y="420" width="540" height="110" rx="10" fill="#eceff1" stroke="#c62828" stroke-width="4"/><text x="310.0" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">QtWebEngine = Chromium 140</text><text x="310.0" y="468" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">sandbox, izolacja witryn, proces GPU zostają WŁĄCZONE</text><text x="310.0" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#1b1f24">RYZYKO: brak haka nagłówków odpowiedzi, brak farblingu, baza starsza niż 156</text><rect x="690" y="420" width="370" height="110" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/><text x="875.0" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Skrypty strony (JS, własny świat)</text><text x="875.0" y="468" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">Content Scope Scripts, Guard, płynne kółko,</text><text x="875.0" y="490" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">nakładki DDG: Duck Player, Click to Load, autoconsent</text><rect x="40" y="590" width="420" height="80" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/><text x="250.0" y="616" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">Okno Tor = osobny proces</text><text x="250.0" y="638" text-anchor="middle" font-size="12" font-weight="400" fill="#1b1f24">--proxy-server=socks5://... (proxy jest globalne dla procesu)</text><rect x="480" y="590" width="340" height="80" rx="10" fill="#f5f5f5" stroke="#757575" stroke-width="2" stroke-dasharray="8 5"/><text x="650.0" y="616" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1f24">ztbrowser (GTK + WebKitGTK)</text><text x="650.0" y="638" text-anchor="middle" font-size="11" font-weight="400" fill="#1b1f24">buduje się do osiągnięcia parytetu, potem usunięte</text><rect x="840" y="590" width="320" height="80" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="1000.0" y="616" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24">Dane w czasie działania (CC BY-NC-SA)</text><text x="1000.0" y="638" text-anchor="middle" font-size="11" font-weight="400" fill="#1b1f24">Tracker Radar, listy: pobierane, nigdy nie dołączane</text><line x1="310" y1="230" x2="310" y2="160" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="320" y="200" font-size="12" fill="#444">implementuje porty</text><line x1="850" y1="230" x2="850" y2="160" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="860" y="200" font-size="12" fill="#444">używa</text><line x1="560" y1="285" x2="640" y2="285" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="566" y="278" font-size="12" fill="#444">steruje</text><line x1="310" y1="420" x2="310" y2="340" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="320" y="385" font-size="12" fill="#444">steruje</text><line x1="690" y1="475" x2="580" y2="475" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><text x="596" y="466" font-size="12" fill="#444">wstrzykuje</text><path d="M1000,590 L1000,560 L1130,560 L1130,110 L1000,110" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/> <text x="1012" y="552" font-size="12" fill="#444">pobierane w locie</text><line x1="260" y1="590" x2="260" y2="530" stroke="#444" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="700" width="22" height="16" fill="#e3f4e1" stroke="#2e7d32" stroke-width="2"/><text x="90" y="713" font-size="12" fill="#1b1f24">domena (zachowana, rozszerzona)</text><rect x="340" y="700" width="22" height="16" fill="#e1ecfa" stroke="#1565c0" stroke-width="2"/><text x="370" y="713" font-size="12" fill="#1b1f24">nowy adapter / UI</text><rect x="620" y="700" width="22" height="16" fill="#eceff1" stroke="#c62828" stroke-width="2"/><text x="650" y="713" font-size="12" fill="#1b1f24">największe ryzyko</text><rect x="900" y="700" width="22" height="16" fill="#f5f5f5" stroke="#757575" stroke-width="2"/><text x="930" y="713" font-size="12" fill="#1b1f24">tymczasowe</text></svg>
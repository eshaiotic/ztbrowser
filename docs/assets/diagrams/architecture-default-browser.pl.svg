<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="Inter, DejaVu Sans, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1000" height="860" fill="#ffffff"/>
<text x="30" y="48" font-size="22" font-weight="700" fill="#111827">Domyślna przeglądarka: proponowana, nigdy narzucana</text>
<rect x="30" y="90" width="280" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="46" y="124" font-size="17" font-weight="700" fill="#111827">1. Otwiera się okno</text>
<text x="46" y="150" font-size="14" fill="#374151">okna aplikacji nigdy nie pytają;</text>
<text x="46" y="170" font-size="14" fill="#374151">pierwsza klatka nie czeka</text>
<rect x="360" y="90" width="300" height="100" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="376" y="124" font-size="17" font-weight="700" fill="#111827">2. Pytać przy starcie?</text>
<text x="376" y="150" font-size="14" fill="#374151">sekundę później, z pliku</text>
<text x="376" y="170" font-size="14" fill="#374151">default-browser.json (brak: tak)</text>
<rect x="710" y="90" width="275" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="726" y="124" font-size="17" font-weight="700" fill="#111827">Bez pytania</text>
<text x="726" y="150" font-size="14" fill="#374151">osoba wybrała</text>
<text x="726" y="170" font-size="14" fill="#374151">„Nie pytaj więcej”</text>
<rect x="360" y="250" width="300" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="376" y="284" font-size="17" font-weight="700" fill="#111827">3. Pytanie do pulpitu</text>
<text x="376" y="310" font-size="14" fill="#374151">we własnym wątku:</text>
<text x="376" y="330" font-size="14" fill="#374151">xdg-settings get default-web-browser</text>
<rect x="710" y="250" width="275" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="726" y="284" font-size="17" font-weight="700" fill="#111827">Bez paska</text>
<text x="726" y="310" font-size="14" fill="#374151">ZTBrowser już otwiera linki</text>
<text x="726" y="330" font-size="14" fill="#374151">albo brak wpisu / xdg-settings</text>
<rect x="360" y="410" width="300" height="100" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="376" y="444" font-size="17" font-weight="700" fill="#111827">4. Pierwsze pytające okno?</text>
<text x="376" y="470" font-size="14" fill="#374151">jedna propozycja na proces;</text>
<text x="376" y="490" font-size="14" fill="#374151">kolejne okna milczą</text>
<rect x="710" y="410" width="275" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="726" y="444" font-size="17" font-weight="700" fill="#111827">Bez paska</text>
<text x="726" y="470" font-size="14" fill="#374151">pokazało go już inne</text>
<text x="726" y="490" font-size="14" fill="#374151">okno tego procesu</text>
<rect x="360" y="570" width="300" height="110" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="376" y="604" font-size="17" font-weight="700" fill="#111827">5. Pasek z pytaniem</text>
<text x="376" y="630" font-size="14" fill="#374151">„ZTBrowser nie jest domyślną</text>
<text x="376" y="650" font-size="14" fill="#374151">przeglądarką”: trzy odpowiedzi →</text>
<rect x="710" y="548" width="275" height="62" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="726" y="574" font-size="16" font-weight="700" fill="#111827">Ustaw jako domyślną</text>
<text x="726" y="596" font-size="14" fill="#374151">xdg-settings set … ZTBrowser</text>
<rect x="710" y="624" width="275" height="62" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="726" y="650" font-size="16" font-weight="700" fill="#111827">Nie pytaj więcej</text>
<text x="726" y="672" font-size="14" fill="#374151">asksAtStart: false, na stałe</text>
<rect x="710" y="700" width="275" height="62" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="726" y="726" font-size="16" font-weight="700" fill="#111827">✕ Zamknij</text>
<text x="726" y="748" font-size="14" fill="#374151">wraca przy następnym starcie</text>
<rect x="30" y="570" width="280" height="110" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="46" y="604" font-size="17" font-weight="700" fill="#111827">Preferencje → Interfejs</text>
<text x="46" y="630" font-size="14" fill="#374151">to samo sprawdzenie i zmiana oraz</text>
<text x="46" y="650" font-size="14" fill="#374151">przełącznik przywracający pytanie</text>
<path d="M310,140 L358,140" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,140 L708,140" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="670" y="130" font-size="14" font-weight="600" fill="#374151">nie</text>
<path d="M510,190 L510,248" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="225" font-size="14" font-weight="600" fill="#374151">tak</text>
<path d="M660,300 L708,300" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M510,350 L510,408" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="385" font-size="14" font-weight="600" fill="#374151">inna przeglądarka</text>
<path d="M660,460 L708,460" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="670" y="450" font-size="14" font-weight="600" fill="#374151">nie</text>
<path d="M510,510 L510,568" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="520" y="545" font-size="14" font-weight="600" fill="#374151">tak</text>
<path d="M660,600 L684,600 L684,579 L708,579" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,625 L684,625 L684,655 L708,655" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M660,650 L674,650 L674,731 L708,731" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<path d="M170,570 L170,320 L358,320" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="180" y="440" font-size="14" font-weight="600" fill="#374151">przy otwarciu</text>
<rect x="30" y="800" width="22" height="16" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="60" y="813" font-size="13" fill="#374151">własny krok ZTBrowsera</text>
<rect x="244.4" y="800" width="22" height="16" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="274.4" y="813" font-size="13" fill="#374151">decyzja</text>
<rect x="350.8" y="800" width="22" height="16" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="380.8" y="813" font-size="13" fill="#374151">nic się nie zmienia</text>
<rect x="543.6" y="800" width="22" height="16" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="573.6" y="813" font-size="13" fill="#374151">trwały wybór osoby</text>
<rect x="30" y="828" width="22" height="16" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="60" y="841" font-size="13" fill="#374151">jedyny krok, który zmienia ustawienie pulpitu</text>
</svg>

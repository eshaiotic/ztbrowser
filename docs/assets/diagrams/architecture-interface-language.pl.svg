<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" font-family="DejaVu Sans, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111827">Jak ZTBrowser wybiera i stosuje język interfejsu</text>
<rect x="40" y="110" width="224" height="190" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="152.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">interface.json</text>
<text x="152.0" y="168" font-size="11.5" text-anchor="middle" fill="#374151">Wybór użytkownika:</text>
<text x="152.0" y="185" font-size="11.5" text-anchor="middle" fill="#374151">"system" albo jeden język</text>
<line x1="264" y1="205.0" x2="277" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="280" y="110" width="224" height="190" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="392.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Locale systemu</text>
<text x="392.0" y="168" font-size="11.5" text-anchor="middle" fill="#374151">glib::language_names()</text>
<text x="392.0" y="185" font-size="11.5" text-anchor="middle" fill="#374151">pl_PL.UTF-8, pl, C</text>
<line x1="504" y1="205.0" x2="517" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="520" y="110" width="224" height="190" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="632.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">LanguageChoice::</text>
<text x="632.0" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">resolve</text>
<text x="632.0" y="186" font-size="11.5" text-anchor="middle" fill="#374151">jeden z 68 języków,</text>
<text x="632.0" y="203" font-size="11.5" text-anchor="middle" fill="#374151">angielski (US),</text>
<text x="632.0" y="220" font-size="11.5" text-anchor="middle" fill="#374151">gdy nic nie pasuje</text>
<line x1="744" y1="205.0" x2="757" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="760" y="110" width="224" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="872.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Jednorazowy restart</text>
<text x="872.0" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">z LANGUAGE</text>
<text x="872.0" y="186" font-size="11.5" text-anchor="middle" fill="#374151">tylko dla języka wybranego</text>
<text x="872.0" y="203" font-size="11.5" text-anchor="middle" fill="#374151">ręcznie: GTK, libadwaita</text>
<text x="872.0" y="220" font-size="11.5" text-anchor="middle" fill="#374151">i WebKit czytają LANGUAGE</text>
<text x="872.0" y="237" font-size="11.5" text-anchor="middle" fill="#374151">przy pierwszym użyciu</text>
<line x1="984" y1="205.0" x2="997" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1000" y="110" width="224" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1112.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">InterfaceMessages::</text>
<text x="1112.0" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">install</text>
<text x="1112.0" y="186" font-size="11.5" text-anchor="middle" fill="#374151">wczytuje locales/&lt;tag&gt;.po</text>
<text x="1112.0" y="203" font-size="11.5" text-anchor="middle" fill="#374151">(wkompilowane w program)</text>
<line x1="1224" y1="205.0" x2="1237" y2="205.0" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1240" y="110" width="224" height="190" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1352.0" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">Okna, menu, dialogi,</text>
<text x="1352.0" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827">strona błędu</text>
<text x="1352.0" y="186" font-size="11.5" text-anchor="middle" fill="#374151">każdy tekst z tr!(...)</text>
<text x="1352.0" y="203" font-size="11.5" text-anchor="middle" fill="#374151">lub catalogue.text(...)</text>
<rect x="40" y="340" width="20" height="20" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="68" y="355" font-size="14" fill="#111827">Zapisane</text>
<rect x="172" y="340" width="20" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="200" y="355" font-size="14" fill="#111827">Decyzja</text>
<rect x="295" y="340" width="20" height="20" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="323" y="355" font-size="14" fill="#111827">Stosuje język</text>
<text x="40" y="420" font-size="14" fill="#4b5563">Zmiana w Preferencje > Interface zapisuje się od razu i działa od następnego uruchomienia.</text></svg>
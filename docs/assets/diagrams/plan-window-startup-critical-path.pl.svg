<text x="24" y="58" font-size="12.5" fill="#5b6270">Zmierzone do pierwszej klatki Wayland: pakiet 0,72 s (mediana z 4), AppImage 1,73 s. Szerokości pól są poglądowe, nie w skali.</text>
